    ['domestic','Digital Security Hub (DiSH), Greater Manchester','','Launched Jun 2022','Regional cyber innovation hub led by Barclays Eagle Labs with Manchester City Council, Lancaster University and the University of Manchester as partners, Plexal as innovation/accelerator delivery partner. A 13-year initiative targeting 500 supported startups and 1,000+ jobs; 11,000 sq ft base at Heron House, Manchester. A local-authority/private-sector-led initiative rather than a DSIT national programme.','https://www.greatermanchester-ca.gov.uk/what-we-do/digital/digital-strategy/digitally-enabling-a-resilient-and-prosperous-economy/greater-manchester-cyber-ecosystem/greater-manchester-digital-security-hub-dish/','y','','','active'],
    ['domestic','Government Cyber Action Plan / Government Cyber Unit','','Jan 2026','£210m package establishing a Government Cyber Unit to coordinate cross-department risk management and incident response, delivering against the Government Cyber Security Strategy 2022–2030. Developed by DSIT in consultation with departments, industry and the Government Cyber Advisory Board.','https://www.gov.uk/government/publications/government-cyber-action-plan/government-cyber-action-plan','y','','Cross-referenced in Policy Timeline and Institutions.','active'],
    ['domestic','Cyber Growth Action Plan','','18 Jun 2025','Announced by DSIT and the Cabinet Office; led by independent experts at the University of Bristol and Imperial College London\'s Centre for Sectoral Economic Performance. A growth-focused review of the UK cyber sector (then £13.2bn revenue, 67,000+ jobs) examining supply/demand and emerging-tech opportunities (AI, quantum), feeding recommendations into the next National Cyber Strategy.','https://www.gov.uk/government/news/new-plans-to-supercharge-uk-cyber-sector','y','','','active'],
    ['domestic','Cyber Local','','2025–2026','DSIT-funded regional programme (2025–2026 round: up to £1.8m) targeting growth of the cyber security sector and cyber skills development outside London and the South East.','https://www.ukri.org/opportunity/cyber-local-2025-2026/','y','','','active'],
    ['international','Five Eyes cyber cooperation','','','UK, US, Australia, Canada, New Zealand. Includes the Five Eyes Law Enforcement Group Cyber Crime Working Group (chaired by the UK\'s NCA), joint threat briefings, and the Secure Innovation guidance — originally a UK-only NCSC/NPSA product, extended across all Five Eyes countries from late 2024 to help tech startups protect themselves from state-threat targeting.','https://www.ncsc.gov.uk/news/five-eyes-launch-shared-advice-tech-startups','y','','','active'],
    ['international','Counter Ransomware Initiative (CRI)','','','Multilateral (65+ country) initiative the UK helped found and continues to co-lead, focused on disrupting ransomware actors\' business model through sanctions, law enforcement coordination and information-sharing. UK has sanctioned 36+ cyber-criminal actors since 2021, including figures linked to Evil Corp, LockBit and TrickBot.','https://s3.amazonaws.com/thegovernmentsays-files/content/188/1881674.html','y','','','active'],
    ['international','UK Ukraine Cyber Programme (UCP)','','Since Feb 2022','Stood up within days of the February 2022 invasion; existence declassified November 2022. Initial £6.35m package; expanded by up to £25m (£16m confirmed UK funding plus up to £9m from allies) in June 2023, extending the programme to at least 2025. Provides incident response, forensic and hardening support to Ukrainian government and CNI entities against attacks including Industroyer2 wiper malware.','https://gov.uk/government/news/uk-boosts-ukraines-cyber-defences-with-6-million-support-package','y','','','active'],
    ['international','Pall Mall Process','','Launched Feb 2024','UK–France co-led (launched Lancaster House, London, 6–7 Feb 2024) multistakeholder initiative tackling proliferation and irresponsible use of commercial cyber intrusion capabilities (spyware, malware-as-a-service). 21+ governments, plus Google, Microsoft, Apple and Meta, have signed the resulting Code of Practice for States (Paris conference, April 2025). Second phase from 2026 develops complementary guidance for industry.','https://www.gov.uk/government/publications/the-pall-mall-process-declaration-tackling-proliferation-and-irresponsible-use-of-commercial-cyber-intrusion-capabilities/the-pall-mall-process-tackling-the-proliferation-and-irresponsible-use-of-commercial-cyber-intrusion-capabilities','y','','','active'],
    ['international','Budapest Convention / UN cybercrime treaty engagement','','','UK promotes the Council of Europe\'s Budapest Convention as the leading cybercrime cooperation template; participates — alongside allies, having initially resisted a competing Russian-tabled UN process — in the newer UN treaty negotiations following the December 2019 UNGA resolution.','https://committees.parliament.uk/writtenevidence/114408/html/','y','','','active']
  ])).concat(
  R('regulation', [
    ['crit-infra','Network and Information Systems Regulations 2018 (NIS Regulations)','','In force May 2018','UK\'s core cross-sector cyber regulation, covering energy, transport, health, drinking water, digital infrastructure and some digital services (online marketplaces, search engines, cloud). Each sector has a “competent authority” regulator. Derived from the (now-superseded) EU NIS Directive.','https://commonslibrary.parliament.uk/research-briefings/cbp-10442/','y','crit-infra','','active'],
    ['crit-infra','Cyber Security and Resilience (NIS) Bill','','In progress','At House of Lords committee stage as of this research. Expands NIS scope to include data centres, large load controllers, managed service providers and critical suppliers; strengthens incident-reporting duties; gives regulators cost-recovery, higher-fine and information-sharing powers; gives the Secretary of State powers to direct organisations on national-security grounds. Broadly welcomed by NCSC and techUK; criticised by some for a sector scope that would not have covered the 2025 M&S/Jaguar Land Rover attacks.','https://commonslibrary.parliament.uk/research-briefings/cbp-10442/','y','crit-infra','Not yet in force — see Evolving.','active'],
    ['cybercrime','Computer Misuse Act 1990','','Royal Assent 1990','Principal UK legislation criminalising unauthorised access to computer systems/data. Long criticised by the security-research community (via the CyberUp Campaign, active since 2020) for having no statutory defence for good-faith vulnerability research, exposing legitimate researchers to prosecution risk.','https://en.wikipedia.org/wiki/Computer_Misuse_Act_1990','y','cybercrime','','active'],
    ['cybercrime','Computer Misuse Act reform, via National Security Bill','','Announced 13 May 2026','Proposes a new “Cyber Crime Risk Order” and, per the CyberUp Campaign\'s stated test, is intended to include a statutory public-interest defence for good-faith security research — though this is not yet confirmed. Follows a long consultation history: 2021 call for evidence, Feb–Apr 2023 consultation, a Nov 2023 King\'s Speech omission, a Dec 2024 failed Data Bill amendment, a Jan 2025 rejection by the then science minister, and a Dec 2025 government commitment to reform ahead of the May 2026 vehicle being confirmed.','https://www.computerweekly.com/news/366642884/Computer-Misuse-Act-reform-to-move-forward-in-National-Security-Bill','y','cybercrime','Still primary legislation in progress — see Evolving.','active'],
    ['cybercrime','Ransomware payment ban & mandatory reporting regime','','Confirmed 22 Jul 2025','Targeted ban on ransomware payments for public sector and CNI operators; a “payment prevention” notification regime for other businesses intending to pay; new mandatory ransomware incident-reporting requirement. To be implemented via the CS&R Bill framework and/or further secondary legislation.','https://www.jumpsec.com/guides/uk-ransomware-payment-ban-implications-what-it-means-for-public-and-private-sector-cybersecurity/','y','cybercrime','Legislative vehicle and commencement date not yet finalised — see Evolving.','active'],
    ['consumer-telecoms','Telecommunications (Security) Act 2021','','Royal Assent 17 Nov 2021','New statutory security duties on providers of public electronic communications networks/services (three-tiered, Ofcom-enforced, fines up to 10% of turnover or £100k/day); created the “designated vendor direction” power used to mandate removal of Huawei equipment from UK 5G networks by 2027.','https://www.linklaters.com/fr-fr/insights/blogs/digilinks/2021/november/uk-telecommunications-security-act-2021-heralds-a-step-change-in-cyber-laws','y','consumer-telecoms','','active'],
    ['consumer-telecoms','Huawei Designated Vendor Direction','','Issued 13 Oct 2022','The statutory instrument that formalised the Jul 2020 Huawei removal policy under the TSA 2021\'s section 105Z1 power. A designation notice (under s.105Z8) and the Direction itself were issued the same day to 35 UK public telecoms providers. Key requirements: no Huawei 5G equipment procured after 31 December 2020 may be used; phased restrictions on Huawei equipment in fixed-fibre access networks, tied to the US Foreign-Produced Direct Product Rule changes of 19 May and 17 Aug 2020; a hard deadline of 28 January 2023 for removing Huawei from mobile access networks serving \u201cSites Significant to National Security.\u201d Followed a targeted consultation opened 18 Feb 2022 with affected providers and Huawei itself.','https://www.gov.uk/government/news/huawei-legal-notices-issued','y','consumer-telecoms','Added to this dataset in August 2026, sourced directly to gov.uk rather than via the secondary legal commentary the adjacent TSA 2021 entry above still cites — worth eventually re-sourcing that entry too for consistency.','active'],
    ['consumer-telecoms','Product Security and Telecommunications Infrastructure Act 2022 (PSTI), Part 1','','Royal Assent 6 Dec 2022','Statutory IoT/consumer-connectable-product security regime (bans universal default passwords, mandates vulnerability-disclosure policies and minimum support-period transparency), building on the voluntary 2018 Code of Practice for Consumer IoT Security and ETSI EN 303 645. Detailed requirements set out in the PSTI (Security Requirements for Relevant Connectable Products) Regulations 2023.','https://www.lexology.com/library/detail.aspx?g=46f3087d-48d4-4110-81be-430142ba8b4e','y','consumer-telecoms','','active'],
    ['codes-standards','Cyber Governance Code of Practice','','2024','DSIT/NCSC/industry-developed board-level guidance on director and board responsibilities for cyber resilience — part of the National Cyber Strategy 2022\'s implementation.','https://www.clydeco.com/en/insights/2024/04/uk-cyber-governance-code-of-practice-what-it-could','y','codes-standards','','active'],
    ['codes-standards','Software Security Code of Practice','','','DSIT/NCSC-co-developed voluntary code for organisations that develop or sell software, addressing supply-chain and resilience risk; feedback survey open to Dec 2026.','https://www.isc2.org/Insights/2025/07/UK-Software-Security-AI-Codes-of-Practice','y','codes-standards','','active'],
    ['codes-standards','AI Cyber Security Code of Practice','','Published 31 Jan 2025','Published by DSIT with NCSC, following a May–Aug 2024 Call for Views. Voluntary; sets baseline cyber security requirements across the AI lifecycle (secure design, development, deployment, maintenance, end-of-life), addressing AI-specific risks such as data poisoning, model inversion and prompt injection. Intended as the basis for a new global standard via ETSI (TS 104 223).','https://www.regulationtomorrow.com/2025/02/government-publishes-new-ai-cyber-security-code-of-practice-and-implementation-guide/','y','codes-standards','','active'],
    ['export','Export Control Order 2008 / UK dual-use list (cyber-surveillance items)','','','UK\'s consolidated strategic/dual-use export control list, derived from the Wassenaar Arrangement\'s List of Dual-Use Goods and Technologies plus national additions. Covers “intrusion software” and IP-network surveillance systems (see Breakthroughs for the 2013 UK/France Wassenaar proposal). Cryptography-using consumer goods are decontrolled under “Note 3” unless specially modified.','https://www.europarl.europa.eu/RegData/etudes/BRIE/2023/754439/EXPO_BRI(2023)754439_EN.pdf','y','export','','active'],
    ['export','Pall Mall Process — Code of Practice for States','','Apr 2025','Sits alongside (not replacing) formal export-control law: functions as a quasi-regulatory instrument governing state purchase and use of commercial cyber intrusion capabilities. Full initiative detail in International Initiatives.','https://www.gov.uk/government/publications/the-pall-mall-process-declaration-tackling-proliferation-and-irresponsible-use-of-commercial-cyber-intrusion-capabilities/the-pall-mall-process-tackling-the-proliferation-and-irresponsible-use-of-commercial-cyber-intrusion-capabilities','y','export','Cross-referenced with International Initiatives.','active']
  ])).concat(
  R('breakthrough', [
    ['codebreaking-heritage','Bletchley Park codebreaking, incl. Enigma decryption','Alan Turing; Gordon Welchman; Dilly Knox and the wider Government Code & Cypher School team','WWII','Cryptanalysis of the German Enigma and Lorenz ciphers; historians credit the work with shortening the war and saving lives. Direct institutional ancestor of GCHQ/NCSC\'s cyber mission — protecting the UK\'s own communications while breaking others\'.','https://www.gchq.gov.uk/section/history/our-origins-and-wwi','y','codebreaking-heritage','','active'],
    ['codebreaking-heritage','Colossus — world\'s first programmable electronic digital computer','Tommy Flowers (engineer)','1943–44','Built at Bletchley Park to break the German Lorenz cipher used for high-command traffic; a foundational moment for both computing and signals-intelligence/cyber history, frequently cited as the origin point of the UK\'s computer-security tradition.','https://www.historytoday.com/archive/feature/beyond-bletchley-gchq-and-british-intelligence','y','codebreaking-heritage','','active'],
    ['threat-detection-ai','Darktrace\'s Enterprise Immune System — first AI-native cyber defence platform','Founders incl. Poppy Gustafsson, Dave Palmer, Jack Stockdale; seed-funded by Mike Lynch\'s Invoke Capital; drew on Cambridge mathematicians and government-intelligence veterans','2013','Founded in Cambridge; pioneered self-learning/unsupervised-AI anomaly detection modelled on the human immune system, rather than signature-based detection. Later launched Antigena, an autonomous-response capability. IPO on the LSE April 2021 (~$2.4bn valuation); acquired by Thoma Bravo October 2024 for $5.3bn.','https://www.summitpartners.com/resources/darktrace-pioneering-ai-in-the-cyber-security-space','y','threat-detection-ai','','active'],
    ['policy-diplomacy','Intrusion-software export controls (Wassenaar Arrangement)','UK and France (proposing states)','2013','The UK and France jointly proposed adding “intrusion software” and “IP network communications surveillance systems” to the Wassenaar Arrangement\'s dual-use control list — the first international effort to directly regulate commercial spyware technologies, and the diplomatic ancestor of the 2024 Pall Mall Process.','https://www.lawfaremedia.org/article/wassenaar-export-controls-surveillance-tools-new-exemptions-for-vulnerability-research','y','policy-diplomacy','','active']
  ])).concat(
  R('evolving', [
    ['governance','Departmental home for cyber security policy post-DSIT','','Jul 2026 – ongoing','DSIT was abolished 21 July 2026. Cyber resilience is reported to be moving into an enlarged DCMS alongside other “digital foundations” functions, but no gov.uk primary source confirms this for cyber specifically, and the CS&R Bill\'s own parliament.uk page still listed DSIT as sponsoring department as of 23 July 2026 — likely a lag rather than a substantive fact, but not asserted either way here.','https://sifted.eu/articles/dsit-reshuffle-uk-tech-policy-dbsit-dcms-cabinet','n','unresolved','No official confirmation identified for cyber security specifically.','active'],
    ['governance','Department name changed twice within days','','Jul 2026','DSIT\'s functions were redistributed into a business department initially referred to as “DBIST”; GOV.UK\'s own Machinery of Government fact sheet was itself corrected on 27 Jul 2026, shortening the acronym to “BIST.” This tool uses “DBIST”/the business department descriptively throughout — worth checking current usage before publishing further updates.','https://www.gov.uk/government/news/machinery-of-government-changes-fact-sheet','y','unresolved','Terminology genuinely still in flux; affects every sector in this tool, not just cybersecurity.','active'],
    ['legislative','Cyber Security and Resilience Bill — final form and commencement','','','At Lords committee stage as of this research; Royal Assent and commencement dates not yet set. Final scope — especially whether retail/automotive-style attacks like the 2025 M&S and Jaguar Land Rover incidents will end up in scope — remains contested.','https://commonslibrary.parliament.uk/research-briefings/cbp-10442/','y','unresolved','','active'],
    ['legislative','Ransomware payment ban and mandatory reporting regime — legislative vehicle','','Since Jul 2025','Policy direction confirmed 22 Jul 2025 but not yet in force; unclear whether it lands inside the CS&R Bill, a separate instrument, or secondary legislation.','https://www.jumpsec.com/guides/uk-ransomware-payment-ban-implications-what-it-means-for-public-and-private-sector-cybersecurity/','y','unresolved','','active'],
    ['legislative','Computer Misuse Act reform — whether the statutory defence survives drafting','','Since 13 May 2026','The CyberUp Campaign\'s own reaction to the announcement explicitly frames “a clear, workable statutory defence for good-faith cyber security activity” as the open test of the National Security Bill, not a guaranteed outcome.','https://www.computerweekly.com/news/366642884/Computer-Misuse-Act-reform-to-move-forward-in-National-Security-Bill','y','unresolved','','active'],
    ['threat-landscape','AI\'s dual effect on the offence/defence balance','','2025–2026','Recurring theme across NCSC\'s 2025 Annual Review (highly significant attacks up 50%, third consecutive year of growth) and industry commentary on the May 2026 CMA reform announcement: AI is simultaneously scaling attacker capability and creating friction for defenders operating under 35-year-old unauthorised-access law.','https://www.computerweekly.com/news/366642884/Computer-Misuse-Act-reform-to-move-forward-in-National-Security-Bill','y','unresolved','','active'],
    ['governance','National Laboratory for Operational Technology Security — current activity','','Since Dec 2021','Announced at the Dec 2021 National Cyber Strategy launch; current operating status or output could not be independently verified during this research pass.','https://www.techuk.org/resource/uk-government-releases-national-cyber-strategy.html','n','unresolved','','active']

var DATA_CONNECTIVITY = [].concat(
  R('timeline', [
    ['milestone','Future Telecoms Infrastructure Review (FTIR) published','','23 Jul 2018','DCMS review setting the long-term national strategy for full-fibre and 5G rollout; established the policy basis for subsequent gigabit-broadband and 5G funding programmes.','https://www.gov.uk/government/calls-for-evidence/future-telecoms-infrastructure-review-call-for-evidence','y','','Call for evidence and terms of reference confirmed on gov.uk; the July 2018 final report PDF itself was not independently re-loaded during this research pass.','active'],
    ['milestone','Telecoms Supply Chain Review launched','','Nov 2018 – Jul 2019','Cross-government review (DCMS-led) of security and resilience risks in the telecoms equipment supply chain; tasked NCSC with assessing “high-risk vendors” (Huawei, ZTE), setting up the 2020 Huawei decisions.','https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/963258/20181108_Telecoms_Supply_Chain_Review_Terms_of_Reference_V2.pdf','y','','','active'],
    ['milestone','NCSC advises capped Huawei role in UK 5G networks','','28 Jan 2020','Following the Telecoms Supply Chain Review, NCSC published Telecoms Security Requirements permitting Huawei a capped role (max 35%) in the non-sensitive periphery of UK 5G networks, excluded from network cores and sensitive sites.','https://www.ncsc.gov.uk/guidance/ncsc-advice-on-the-use-of-equipment-from-high-risk-vendors-in-uk-telecoms-networks','y','','Superseded by the July 2020 decision below, following new US sanctions on Huawei.','active'],
    ['milestone','Shared Rural Network (SRN) agreement signed','','9 Mar 2020','£1bn deal between DCMS/Ofcom and the four then-MNOs (EE, Vodafone, O2, Three) to close mobile “not-spots,” targeting 95% combined 4G geographic coverage by end of 2025 via a jointly owned infrastructure company (Digital Mobile Spectrum Ltd).','https://www.gov.uk/government/news/shared-rural-network','y','','','active'],
    ['milestone','UK government takes equity stake in OneWeb','','Jul 2020','UK government invested an initial ~$500m/£374m to rescue satellite operator OneWeb from bankruptcy, in pursuit of “UK sovereign space capability,” later rising to £517m total. Retained a “golden share” with national-security veto rights.','https://publications.parliament.uk/pa/cm5803/cmselect/cmsctech/100/report.html','y','','Exact investment date varies slightly across sources (Apr/Jun/Jul 2020). See the Eutelsat OneWeb merger under International Initiatives for the current ownership structure.','active'],
    ['milestone','Huawei ban: complete removal from UK 5G networks by 2027 announced','','14 Jul 2020','Digital Secretary Oliver Dowden’s statement to the House of Commons: no new Huawei 5G equipment purchases after 31 December 2020; complete removal from 5G networks by end of 2027; announced the forthcoming Telecoms Security Bill. Reversed the January 2020 capped-role decision, citing US sanctions on Huawei’s semiconductor supply chain.','https://www.gov.uk/government/speeches/digital-culture-media-and-sport-secretarys-statement-on-telecoms','y','','','active'],
    ['milestone','5G Supply Chain Diversification Strategy published','','30 Nov 2020','DCMS strategy to diversify the telecoms vendor market after the Huawei decision, backed by an initial £250m. Three strands: support incumbent suppliers (Nokia, Ericsson); attract new entrants; accelerate Open RAN/open-interface solutions. Established the Telecoms Diversification Taskforce, the National Telecoms Lab commitment, and (with Japan’s NEC) the UK’s first major Open RAN trial.','https://www.gov.uk/government/publications/5g-supply-chain-diversification-strategy','y','','','active'],
    ['milestone','Telecommunications (Security) Act 2021 — Royal Assent','','17 Nov 2021','Amends the Communications Act 2003, creating a new statutory telecoms security framework and new Ofcom enforcement powers, and putting high-risk-vendor decisions on a statutory footing via Designated Vendor Directions.','https://www.legislation.gov.uk/ukpga/2021/31/notes/division/2/index.htm','y','','Full regulatory detail — including the Designated Vendor Direction later used to formalise the Huawei removal requirement — is filed in full under the Cybersecurity sector’s Regulation tab; this entry marks the legislative milestone only.','active'],
    ['milestone','Project Gigabit launched','','2020–2021','£5bn DCMS/BDUK programme (£1.2bn allocated in the 2020 Spending Review for 2020–2025, remainder reserved) to deliver gigabit-capable broadband to the ~20% of UK premises commercial rollout won’t reach.','https://commonslibrary.parliament.uk/research-briefings/cbp-9207/','y','','','active'],
    ['milestone','National Space Strategy published','','Sep 2021','UK’s first National Space Strategy (then-BEIS/DfT, under the National Space Council). Included here only for its communications-relevant content (satellite comms, PNT resilience); broader UK space policy such as launch and Earth observation is out of scope for this sector.','https://www.gov.uk/government/publications/national-space-strategy/national-space-strategy','y','','','active'],
    ['milestone','Product Security and Telecommunications Infrastructure Act 2022 — Royal Assent','','6 Dec 2022','Part 1 (consumer connectable-product security) is filed in full under the Cybersecurity sector. Part 2 (Electronic Communications Code reform, speeding up deployment of mobile/full-fibre/gigabit infrastructure) is the Advanced-Connectivity-specific content, filed in full under this sector’s Regulation tab.','https://www.legislation.gov.uk/ukpga/2022/46/notes/division/2/index.htm','y','','','active'],
    ['milestone','UK Wireless Infrastructure Strategy published','','12 Apr 2023','DSIT strategy setting an ambition for standalone 5G (5GSA) coverage of all populated UK areas by 2030 (up from the prior “majority of population by 2027,” itself met early). Includes a UK 6G vision chapter, a national mission backed by up to £100m initial funding for “future telecoms,” the £40m 5G Innovation Regions fund, and £8m for satellite broadband to the hardest-to-reach premises.','https://assets.publishing.service.gov.uk/media/64357c81877741001368d7fd/uk_wireless_infrastructure_strategy.pdf','y','','','active'],
    ['milestone','UK Telecoms Innovation Network (UKTIN) announced','','Apr 2023','£10m DCMS/DSIT-funded coordinating body (recommended by the Telecoms Diversification Taskforce), delivered by Digital Catapult, Cambridge Wireless, University of Bristol and WM5G, to act as a single navigation point for telecoms R&D funding, testbeds and collaboration.','https://www.techuk.org/resource/dcms-announces-uk-telecoms-innovation-network.html','n','','Secondary-sourced (techUK); no standalone gov.uk press release located. See Domestic Initiatives for the canonical UKTIN entry.','active'],
    ['milestone','UK re-associates to Horizon Europe (incl. SNS JU eligibility)','','1 Jan 2024','UK research entities became eligible, on equal terms to EU/associated-country entities, for all Horizon Europe 2024-Work-Programme-onward calls — including the EU’s Smart Networks and Services Joint Undertaking (SNS JU), Europe’s main 6G research vehicle.','https://www.gov.uk/government/publications/horizon-europe-and-copernicus-programmes-2023-uk-eu-agreement-explainer/horizon-europe-and-copernicus-programmes-2023-uk-eu-agreement-explainer','y','','','active'],
    ['milestone','DSIT abolished; telecoms/connectivity policy returns to DCMS','','21 Jul 2026','PM Andy Burnham’s Whitehall reshuffle dissolved DSIT. Telecoms, broadband and mobile policy — including BDUK, and hence Project Gigabit and the Shared Rural Network — moved to an expanded DCMS (Department for Digital, Culture, Media and Sport) under Secretary of State Lisa Nandy MP; Ofcom’s sponsoring department also reverted to DCMS. Science/innovation policy went to the renamed DBIST; AI strategy went to the Cabinet Office.','https://www.gov.uk/government/news/machinery-of-government-changes-fact-sheet','y','','Very recent; see Evolving for residual uncertainty (junior ministerial appointment, UK Space Agency/OneWeb-Eutelsat stake sponsorship).','active']
  ])).concat(
  R('institution', [
    ['','Ofcom','','','Independent regulator for UK communications (telecoms, spectrum, post, broadcasting). Central to this sector: spectrum licensing/auctions, telecoms security enforcement, Electronic Communications Code disputes, satellite/space spectrum authorisation. Sponsoring department: DCMS.','https://www.ofcom.org.uk','y','','','active'],
    ['','DCMS (Department for Digital, Culture, Media and Sport)','','','Current sponsoring department for telecoms, broadband, mobile and spectrum policy (since 21 July 2026; also 2016–Feb 2023). Sponsors Ofcom and BDUK.','https://www.gov.uk/government/organisations/department-for-digital-culture-media-and-sport','y','','','active'],
    ['','DSIT (historical, 2023–2026)','','','Sponsored telecoms/connectivity policy from February 2023 until its abolition on 21 July 2026. Preserved as the accurate historical departmental attribution for entries dated in that window, per this tool’s standing convention of not retrospectively relabelling history.','','n','','','dissolved'],
    ['','Building Digital UK (BDUK)','','','Executive agency responsible for delivering Project Gigabit and the Shared Rural Network. Moved DCMS→DSIT→DCMS with its parent department each time. Current sponsor: DCMS.','https://www.gov.uk/government/organisations/building-digital-uk','y','','','active'],
    ['','UK Space Agency','','','Executive agency responsible for UK space policy, including satellite communications programmes via ESA’s ARTES scheme and the National Timing Centre (PNT resilience) — the connectivity-relevant slice of its remit.','https://www.gov.uk/government/organisations/uk-space-agency','y','','Current sponsoring department not confirmed following the July 2026 DSIT abolition — see Evolving.','active'],

    ['','Satellite Applications Catapult','','','UK Catapult centre bridging space-sector research and business application; included here for its satellite-communications-relevant work only — broader Earth-observation/space-domain-awareness activity is out of this sector’s scope.','https://sa.catapult.org.uk','y','','','active'],
    ['','Smart Internet Lab, University of Bristol','','','Founded 2015 by Prof. Dimitra Simeonidou; one of the UK’s leading 5G/6G/optical-networks research testbeds. Hosted the world’s first public 5G showcase (March 2018). Delivers the national 5GUK Test Network and leads the JOINER platform (14 federated UK labs/testbeds). Co-delivery partner of UKTIN.','https://www.bristol.ac.uk/engineering/research/smart/','y','','','active'],

    ['international','Horizon Europe SNS JU eligibility (post-association)','','From 1 Jan 2024','UK entities fully eligible for the EU’s Smart Networks and Services Joint Undertaking (SNS JU) — overall budget at least €1.8bn (2021–27, EU + industry) — from the 2024 Work Programme onward, including as consortium coordinators.','https://smart-networks.europa.eu/faq-sns-ju-2025-calls/','y','','','active'],

    ['infra-access','Product Security and Telecommunications Infrastructure Act 2022, Part 2 — Electronic Communications Code reform','','Commenced in stages through 2023','Reforms operators’ rights to install, maintain and upgrade communications apparatus (masts, cabinets, fibre); changes to the Electronic Communications Code, alternative dispute resolution (in force 7 Nov 2023), and measures targeting deployment in multi-dwelling buildings.','https://www.legislation.gov.uk/ukpga/2022/46/notes/division/2/index.htm','y','infra-access','','active'],
    ['satellite','Ofcom Space Spectrum Strategy','','','Ofcom’s framework and periodic consultations on spectrum for satellite services (GSO and NGSO systems), including “stations in motion” (aircraft/ship connectivity) and monitoring of direct-to-handset satellite services.','https://www.ofcom.org.uk/siteassets/resources/documents/consultations/category-2-6-weeks/233841-space-spectrum-strategy/associated-documents/secondary-documents/consultation-space-spectrum-refresh.pdf','y','satellite','','active'],
    ['satellite','Direct-to-Device (D2D) satellite connectivity framework','','Mar 2025 – Feb 2026','Two-part authorisation framework: a discretionary licence exemption for mobile handsets/SIM-enabled devices connecting to D2D satellite services, plus a process for MNOs to request a variation of their existing spectrum licence to offer D2D. Consultation published 25 Mar 2025; UK announced 9 Sep 2025 as the first country in Europe to permit D2D satellite connectivity over existing mobile spectrum; final decision 9 Dec 2025; final regulations statement 17 Feb 2026. VodafoneThree became the first operator approved (900MHz spectrum), with a further consultation on adding its specific frequencies open 15 Apr–18 May 2026. Regulations to be titled the Wireless Telegraphy (Direct to Device Satellite Communications) (Exemption) Regulations 2026. Enables ordinary smartphones to connect directly to satellites for calls/texts/data where terrestrial coverage is absent, complementing the Shared Rural Network in rural/coastal not-spots.','https://www.ofcom.org.uk/spectrum/space-and-satellites/consultation-enabling-satellite-direct-to-device-services-in-mobile-spectrum-bands','y','satellite','A live amendment consultation for VodafoneThree’s specific frequencies was still open as of this research (closing 18 May 2026); there may be a further Ofcom statement since.','active'],

  semiconductors: 'Links prioritise primary sources (gov.uk, parliament.uk, company/institution sites, Companies House, SEC/RNS filings) over media coverage, researched August 2026. Items marked <em>no link verified</em> are confirmed but no URL was retrieved during research. This is the first sector in this tool to use the <em>Regulation</em> tab (Export Controls / National Security Screening / Standards / IP &amp; Security Policy) \u2014 reintroduced because semiconductors is more entangled with export-control and investment-screening law than any sector built so far; the Standards sub-tab is left thin deliberately rather than padded with weak material \u2014 no dedicated UK semiconductor standards programme was identified during research. The <em>Evolving</em> tab collects developments that are still genuinely unfolding \u2014 most notably how semiconductor policy splits between BIST and the Cabinet Office AI Taskforce post-reshuffle \u2014 as distinct from the settled historical record in the other tabs. Notable companies (Arm, Pragmatic Semiconductor, Paragraf and others) are referenced within Institutions where directly relevant but are not exhaustively profiled here \u2014 see the person\u2019s companion research document for fuller company detail. In the Breakthroughs section the <em>subtitle</em> field lists key people; the <em>caveat</em> field lists clarifying or sourcing notes. Import replaces all records for the section(s) present in the uploaded file; other sections are unaffected. Template CSV includes one guide row and one example per type \u2014 delete both before importing real data. Valid section values: timeline | institution | initiative | regulation | breakthrough | evolving. Initiative rows use type domestic or international; regulation rows use type export, nsi, standards or ipsec.',
  cyber: 'Links prioritise primary sources (gov.uk, parliament.uk, legislation.gov.uk, NCSC/GCHQ/NPSA/MI5, company and institution sites) over media coverage, researched August 2026. Items marked <em>no link verified</em> are confirmed but no URL was retrieved during research. Cybersecurity uses its own five-group <em>Regulation</em> taxonomy (Critical Infrastructure &amp; Essential Services / Cybercrime Law / Consumer, Product &amp; Telecoms Security / Codes of Practice &amp; Standards / Export Controls) rather than reusing Semiconductors\u2019 four sub-tabs \u2014 a deliberate choice, since this tool does not enforce cross-sector taxonomy consistency for Regulation. The National Cyber Advisory Board (whole-economy, Cabinet Office) and the Government Cyber Advisory Board (government\u2019s own estate, DSIT) are two genuinely distinct bodies, not a renaming of one into the other \u2014 both appear separately under Institutions. The <em>Evolving</em> tab collects developments that are still genuinely unfolding \u2014 most notably where cyber security policy lands within government after DSIT\u2019s July 2026 abolition, and whether the Cyber Security and Resilience Bill\u2019s final scope and the Computer Misuse Act\u2019s statutory defence survive drafting \u2014 as distinct from the settled historical record in the other tabs. Notable companies (Darktrace, Sophos, NCC Group, BAE Systems Digital Intelligence) are included as anchor players within Institutions rather than exhaustively profiled \u2014 see the person\u2019s companion research document for fuller company detail. Post-quantum cryptography migration is deliberately not duplicated here; it is covered in the Quantum sector\u2019s Breakthroughs/Timeline. In the Breakthroughs section the <em>subtitle</em> field lists key people; the <em>caveat</em> field lists clarifying or sourcing notes. Import replaces all records for the section(s) present in the uploaded file; other sections are unaffected. Template CSV includes one guide row and one example per type \u2014 delete both before importing real data. Valid section values: timeline | institution | initiative | regulation | breakthrough | evolving. Initiative rows use type domestic or international; regulation rows use type crit-infra, cybercrime, consumer-telecoms, codes-standards or export.',

as distinct from the settled historical record in the other tabs. Notable companies (BT/EE, VodafoneThree, VMO2, CityFibre, Eutelsat OneWeb, NEC, Goonhilly) are referenced within Institutions/International Initiatives where directly relevant but are not exhaustively profiled here \u2014 see the person\u2019s companion research document for fuller company detail. The Global Coalition on Telecommunications appears here in full and, less centrally, in Semiconductors\u2019 International Initiatives \u2014 kept in both rather than resolved. In the Breakthroughs section the <em>subtitle</em> field lists key people; the <em>caveat</em> field lists clarifying or sourcing notes. Import replaces all records for the section(s) present in the uploaded file; other sections are unaffected. Template CSV includes one guide row and one example per type \u2014 delete both before importing real data. Valid section values: timeline | institution | initiative | regulation | breakthrough | evolving. Initiative rows use type domestic or international; regulation rows use type spectrum, infra-access, satellite or consumer-telecoms.'

var LANDSCAPE_FOOTER = 'All six frontier technologies named in the UK Government\u2019s 2025 Modern Industrial Strategy, Digital and Technologies Sector Plan are now populated: Quantum Technologies, Engineering Biology, Artificial Intelligence, Semiconductors, Cybersecurity, and Advanced Connectivity. Each follows the same research template (Timeline, Institutions, Initiatives, Breakthroughs, Evolving \u2014 plus, for sectors that need it, Regulation), built from primary sources with unverified items flagged rather than omitted, and reviewed for open questions before publication.';

/* ──────────────── SECTOR FRAMING (context-setting prose per sector) ──────────────── */

var SECTOR_FRAMING = {
  quantum: 'Quantum technologies rank among the UK\u2019s most mature frontier sectors, underpinned by more than a decade of sustained public investment and a research base regularly cited among the world\u2019s top three quantum clusters. The 2023 National Quantum Strategy set a ten-year, \u00a32.5bn framework built around five national missions spanning computing, networking, sensing and timing; a further \u00a32bn followed in March 2026, including a landmark procurement programme for domestically built quantum computers. The sector\u2019s policy home changed in July 2026 as part of a wider machinery-of-government reorganisation, and \u2014 as the Evolving tab sets out \u2014 exactly how quantum-specific leadership continues within the new departmental structure is still becoming clear.',
  engbio: 'Engineering biology \u2014 the application of engineering principles to biological systems \u2014 has grown from a research priority first flagged to government in 2012 into one of six official UK frontier technologies. The 2023 National Vision for Engineering Biology set a ten-year, \u00a32bn ambition and described the UK as home to one of the world\u2019s most capable engineering biology ecosystems; public investment has scaled accordingly, most recently through a \u00a3380m package spanning research programmes and scale-up infrastructure. The sector also carries a genuine, still-unresolved policy question common to biotechnology internationally: the UK\u2019s streamlined domestic approach to regulating gene-edited crops sits alongside ongoing UK\u2013EU trade negotiations that could shape how far that regulatory path is able to diverge from European norms in the years ahead.',
  ai: 'Artificial intelligence occupies a distinct position among the UK\u2019s frontier technologies. It is the sector where Britain has taken the most prominent international convening role \u2014 hosting the first global AI Safety Summit in 2023 \u2014 and also the one where policy emphasis has visibly shifted since, moving from early safety-focused international coordination toward a stronger domestic emphasis on economic growth, sovereign computing capacity, and national-security-oriented evaluation. The UK is home to Google DeepMind, whose AlphaFold work earned a Nobel Prize in 2024, and to one of Europe\u2019s most active AI investment ecosystems. As of mid-2026, AI has become the first UK technology policy area represented by a dedicated Cabinet minister, even as day-to-day responsibility for delivering AI policy is now divided across separate government departments.',
  semiconductors: 'Semiconductors occupies a distinctive position among the UK\u2019s frontier technologies: unlike quantum or engineering biology, Britain has no significant bulk chip-fabrication capacity to rival Taiwan, South Korea or the United States, and the 2023 National Semiconductor Strategy deliberately chose not to compete on that basis. Instead, public funding \u2014 a fraction of the scale of the US CHIPS Act or EU Chips Act \u2014 concentrates on areas of genuine domestic strength: chip design and IP licensing, the world-leading compound semiconductor cluster in South Wales, and emerging strength in flexible electronics and 2D materials. The sector also carries the UK\u2019s most consequential semiconductor-specific national security episode to date: the 2022 forced divestment of the Newport Wafer Fab from Chinese ownership, resolved by its 2024 sale to Vishay. Since 2025, policy has shifted markedly toward AI hardware, culminating in the June 2026 AI Hardware Plan and the renaming of the Compound Semiconductor Applications Catapult into a broader Semiconductor Catapult \u2014 making this the frontier technology most tightly coupled to the UK\u2019s AI ambitions, and, as the Evolving tab sets out, one whose policy ownership within government is still settling after the July 2026 reshuffle.',
  cyber: 'Cybersecurity carries the deepest institutional prehistory of any sector in this tool: GCHQ traces its lineage to the 1919 Government Code &amp; Cypher School, and Bletchley Park\u2019s Colossus \u2014 built to break the Lorenz cipher \u2014 is widely credited as the world\u2019s first programmable electronic computer. The modern policy era began with the National Cyber Security Strategy 2016\u20132021 and the same-year creation of the NCSC, and the sector is now genuinely large: the government\u2019s May 2026 Cyber Security Sectoral Analysis put it at \u00a314.7bn in revenue and roughly 69,600 jobs across 2,600+ firms, both up sharply year-on-year. It also sits inside the most active legislative moment for UK cyber law in a decade \u2014 the Cyber Security and Resilience Bill is midway through the House of Lords, and a separate National Security Bill will bring the first reform of the 35-year-old Computer Misuse Act \u2014 layered on top of the same July 2026 machinery-of-government reshuffle affecting every sector in this tool, which leaves cyber security\u2019s own departmental home genuinely unconfirmed as the Evolving tab sets out.',
  connectivity: 'Advanced connectivity is the sector where UK policy has been most directly shaped by a single geopolitical decision: the 2020 removal of Huawei from UK 5G networks, following US sanctions, cost the rollout an estimated year and up to \u00a32bn, and reshaped a decade of subsequent policy \u2014 the \u00a3250m 5G Supply Chain Diversification Strategy, the UK\u2013Japan Open RAN partnership, and SONIC Labs all trace directly back to it. Beyond vendor security, the sector spans two parallel infrastructure stories: a terrestrial build-out (Project Gigabit, the Shared Rural Network, a 2030 standalone-5G ambition) that is running behind its original targets, and a fast-moving non-terrestrial one, where the UK\u2019s 2020 sovereign-capability bet on OneWeb has since become a minority stake in a French-led satellite group, even as Ofcom\u2019s 2025\u20132026 direct-to-device satellite framework made the UK the first country in Europe to let ordinary smartphones connect straight to satellites. As in every sector in this tool, the July 2026 abolition of DSIT changed departmental ownership \u2014 telecoms returned to an expanded DCMS rather than following science and AI policy elsewhere \u2014 and, as the Evolving tab sets out, exactly who now sponsors the UK\u2019s satellite shareholdings is still unconfirmed.'
};

/* ──────────────── STATE ──────────────── */

var view          = 'landscape';  // 'landscape' | 'sector'
var activeSector  = null;
var activeSection = 'timeline';
var activeSub     = null;

function DATA() { return SECTOR_DATA[activeSector] || []; }
function BC()   { return SECTOR_BC[activeSector] || {}; }

/* ──────────────── VIEW SWITCHING ──────────────── */

function enterSector(key) {
  var meta = SECTOR_META.find(function(s){ return s.key === key; });
  if (!meta || meta.status !== 'active') return;
  activeSector  = key;
  activeSection = 'timeline';
  activeSub     = null;
  view = 'sector';
  renderView();
}

function exitSector() {
  view = 'landscape';
  activeSector = null;
  renderView();
}

function renderView() {
  document.getElementById('landscape-view').style.display = view === 'landscape' ? '' : 'none';
  document.getElementById('sector-view').style.display    = view === 'sector'    ? '' : 'none';
  document.getElementById('back-link').style.display      = view === 'sector'    ? '' : 'none';

  var framingEl = document.getElementById('sector-framing');

  if (view === 'landscape') {
    framingEl.style.display = 'none';
    document.getElementById('page-h1').textContent = 'UK Frontier Technology Landscape';
    document.getElementById('page-sub').innerHTML = 'Six frontier technologies from the UK\u2019s Modern Industrial Strategy &bull; all six built';
    document.getElementById('page-footer').innerHTML = LANDSCAPE_FOOTER;
    renderLandscape();
  } else {
    var meta = SECTOR_META.find(function(s){ return s.key === activeSector; });
    document.getElementById('page-h1').textContent = 'UK ' + meta.label + ' Landscape - Key developments';
    var subLabels = { timeline:'policy timeline', institution:'institutions', initiative:'initiatives (domestic &amp; international)', regulation:'regulation', breakthrough:'breakthroughs', evolving:'evolving developments' };
    var subParts = visibleSections().map(function(s){ return subLabels[s.key] || s.label.toLowerCase(); });
    document.getElementById('page-sub').innerHTML = subParts.join(' &bull; ') + ' &bull; Updated ' + meta.updated;
    document.getElementById('page-footer').innerHTML = SECTOR_FOOTER[activeSector];
    if (SECTOR_FRAMING[activeSector]) {
      framingEl.style.display = '';
      framingEl.style.setProperty('--sector-accent', meta.accent);
      framingEl.innerHTML = SECTOR_FRAMING[activeSector];
    } else {
      framingEl.style.display = 'none';
    }
    renderAll();
  }
}

function renderLandscape() {
  var el = document.getElementById('sector-grid');
  el.innerHTML = SECTOR_META.map(function(s) {
    var isActive = s.status === 'active';
    var count = isActive ? SECTOR_DATA[s.key].length : 0;
    var statusHtml = isActive
      ? '<span class="sector-card-status st-active">' + count + ' entries</span>'
      : '<span class="sector-card-status st-placeholder">Coming soon</span>';
    var pillsHtml = isActive ? '' :
      '<div class="sector-card-pills">' +
        ['Timeline','Institutions','Initiatives','Breakthroughs'].map(function(p){
          return '<span class="sector-card-pill">' + p + '</span>';
        }).join('') +
      '</div>';
    return '<button class="sector-card' + (isActive ? '' : ' is-placeholder') + '" style="--sector-accent:' + s.accent + '" ' +
      (isActive ? ('onclick="enterSector(\'' + s.key + '\')"') : 'disabled aria-disabled="true"') + '>' +
      '<div class="sector-card-top">' +
        '<span class="sector-card-icon"><i class="ti ' + s.icon + '" aria-hidden="true"></i></span>' +
        statusHtml +
      '</div>' +
      '<span class="sector-card-name">' + s.label + '</span>' +
      '<span class="sector-card-blurb">' + s.blurb + '</span>' +
      pillsHtml +
    '</button>';
  }).join('');
}

/* ──────────────── SECTOR-VIEW RENDER ──────────────── */

function getSec()   { return SECTIONS.find(function(s){ return s.key === activeSection; }); }
function getSubs() {
  // Filters the section's full sub-tab list down to just the sub-tabs the *active
  // sector* has at least one record for. This is what lets Regulation carry two
  // different taxonomies (Semiconductors' export/nsi/standards/ipsec and Cybersecurity's
  // crit-infra/cybercrime/consumer-telecoms/codes-standards/export) in one shared
  // SECTIONS config without either sector seeing the other's empty sub-tabs. Same
  // pattern as visibleSections(), one level down.
  var sec = getSec();
  if (!sec || !sec.subs) return null;
  var data = DATA();
  var visible = sec.subs.filter(function(sub) {
    return data.some(function(d){ return d.section === sec.key && d.type === sub.key; });
  });
  return visible.length ? visible : null;
}
function filtered() {
  var all = DATA().filter(function(d){ return d.section === activeSection; });
  return activeSub ? all.filter(function(d){ return d.type === activeSub; }) : all;
}

function visibleSections() {
  // Only show a tab if the current sector actually has records for it \u2014 keeps
  // sector-specific sections (e.g. Regulation, currently semiconductors-only)
  // from appearing empty on sectors that don't use them.
  var data = DATA();
  return SECTIONS.filter(function(s) {
    return data.some(function(d){ return d.section === s.key; });
  });
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = visibleSections().map(function(s) {
    return '<button class="' + (s.key === activeSection ? 'active' : '') + '" onclick="setSection(\'' + s.key + '\')">' +
      '<i class="ti ' + s.icon + '" aria-hidden="true"></i>' + s.label + '</button>';
  }).join('');
}

function renderSubtabs() {
  var subs = getSubs();
  var el = document.getElementById('subtabs');
  if (!subs) { el.innerHTML = ''; return; }
  el.innerHTML = subs.map(function(s) {
    return '<button class="' + (s.key === activeSub ? 'active' : '') + '" onclick="setSubtab(\'' + s.key + '\')">' + s.label + '</button>';
  }).join('');
}

function renderCount() {
  var sec   = getSec();
  var all   = DATA().filter(function(d){ return d.section === activeSection; });
  var shown = filtered();
  var txt   = (activeSub && shown.length !== all.length)
    ? shown.length + ' of ' + all.length + ' entries'
    : all.length + (all.length === 1 ? ' entry' : ' entries');
  document.getElementById('bar-section').textContent = sec.label;
  document.getElementById('bar-count').textContent   = '\u00b7 ' + txt;
}

function badgeHtml(badges) {
  if (!badges || !badges.length) return '';
  var bc = BC();
  return '<span class="badges">' + badges.map(function(b) {
    return '<span class="badge ' + (bc[b] || 'b-corp') + '">' + b + '</span>';
  }).join('') + '</span>';
}

function rowHtml(item) {
  var linkHtml = item.url
    ? '<a href="' + item.url + '" target="_blank" rel="noopener noreferrer" class="visit">Visit <i class="ti ti-external-link" aria-hidden="true"></i></a>'
    : '<span class="no-link">no link verified</span>';
  return '<div class="row">' +
    '<div class="row-body">' +
      '<div class="row-head">' +
        (item.date ? '<span class="row-date">' + item.date + '</span>' : '') +
        '<span class="row-title">' + item.title + '</span>' +
        badgeHtml(item.badges) +
      '</div>' +
      (item.subtitle ? '<p class="row-sub">' + item.subtitle + '</p>' : '') +
      '<p class="row-desc">' + item.description + '</p>' +
      (item.caveat ? '<p class="row-caveat"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span>' + item.caveat + '</span></p>' : '') +
    '</div>' +
    '<div class="row-action">' + linkHtml + '</div>' +
  '</div>';
}

function renderPanel() {
  var items = filtered();
  var el = document.getElementById('panel');
  if (!items.length) {
    el.innerHTML = '<p class="empty">No entries here yet. Import a CSV or download the template to add data.</p>';
  } else {
    el.innerHTML = items.map(rowHtml).join('');
  }
}

function renderAll() { renderTabs(); renderSubtabs(); renderCount(); renderPanel(); }

function setSection(key) {
  activeSection = key;
  var subs = getSubs();
  activeSub = subs ? subs[0].key : null;
  renderAll();
}

function setSubtab(key) {
  activeSub = key;
  renderSubtabs(); renderCount(); renderPanel();
}


/* ──────────────── CSV EXPORT ──────────────── */

var CSV_COLS = ['section','type','title','subtitle','date','description','url','url_verified','badges','caveat','status'];

function esc(v) {
  v = String(v === null || v === undefined ? '' : v);
  if (v.indexOf(',') > -1 || v.indexOf('"') > -1 || v.indexOf('\n') > -1 || v.indexOf('\r') > -1) {
    return '"' + v.replace(/"/g, '""') + '"';
  }
  return v;
}

function toCSV(rows) {
  return [CSV_COLS.join(',')].concat(rows.map(function(r) {
    return CSV_COLS.map(function(c) {
      return esc(c === 'badges' ? r.badges.join('; ') : r[c]);
    }).join(',');
  })).join('\r\n');
}

function dl(filename, content) {
  var blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function exportCurrent() {
  if (!activeSector) return;
  var rows = DATA().filter(function(d){ return d.section === activeSection; });
  dl('uk-' + activeSector + '-' + activeSection + '.csv', toCSV(rows));
  showToast('Downloaded ' + rows.length + ' ' + getSec().label + ' records.', 'ok');
}

function exportAll() {
  if (!activeSector) return;
  dl('uk-' + activeSector + '-all-sections.csv', toCSV(DATA()));
  showToast('Downloaded all ' + DATA().length + ' records across all sections.', 'ok');
}

function downloadTemplate() {
  if (!activeSector) return;
  var bc = BC();
  var breakdownTypes = Object.keys(bc).filter(function(k){ return k !== 'dissolved' && k !== 'paused' && k !== 'unresolved'; });
  var exampleBadge = breakdownTypes[0] || '';

  var hasRegulation = DATA().some(function(d){ return d.section === 'regulation'; });
  var regTypes = hasRegulation
    ? Array.from(new Set(DATA().filter(function(d){ return d.section === 'regulation'; }).map(function(d){ return d.type; })))
    : [];

  var guide = {
    section:      '# GUIDE \u2014 valid values: timeline | institution | initiative' + (hasRegulation ? ' | regulation' : '') + ' | breakthrough | evolving',
    type:         '# initiative types: domestic | international' + (hasRegulation ? '   regulation types (this sector): ' + regTypes.join(' | ') : '') + '   breakthrough types (this sector): ' + breakdownTypes.join(' | '),
    title:        '# Primary name or title of this entry',
    subtitle:     '# Key people, for Breakthroughs only; blank for all other sections',
    date:         '# Year or Mon YYYY for timeline entries; blank for others',
    description:  '# Main description text. Wrap in double-quotes if it contains commas.',
    url:          '# Full URL including https:// \u2014 or leave blank',
    url_verified: '# yes  or  no',
    badges:       '# Semicolon-separated free-text labels. This sector\'s vocabulary: ' + breakdownTypes.concat(['dissolved','paused','unresolved']).join(' | '),
    caveat:       '# Warning or status note e.g. "Paused Dec 2025". Leave blank if none.',
    status:       '# active | dissolved | liquidation | paused'
  };

  var examples = [
    { section:'timeline',      type:'milestone',      title:'EXAMPLE \u2014 Enter milestone title', subtitle:'', date:'Mon YYYY', description:'Brief description of this policy milestone.', url:'https://gov.uk/...', url_verified:'no', badges:'', caveat:'', status:'active' },
    { section:'institution',   type:'',               title:'EXAMPLE \u2014 Enter institution name', subtitle:'', date:'', description:'What this body does and its role in the ecosystem.', url:'https://...', url_verified:'no', badges:'', caveat:'', status:'active' },
    { section:'initiative',    type:'domestic',       title:'EXAMPLE \u2014 Enter initiative name',  subtitle:'', date:'', description:'What this programme funds and who is eligible.', url:'https://...', url_verified:'no', badges:'', caveat:'', status:'active' },
    { section:'initiative',    type:'international',  title:'EXAMPLE \u2014 UK\u2013Country Partnership', subtitle:'', date:'YYYY', description:'Scope and parties of the bilateral agreement.', url:'https://...', url_verified:'no', badges:'', caveat:'Note any caveats here', status:'active' },
    { section:'breakthrough',  type:'example',        title:'EXAMPLE \u2014 Name of breakthrough',    subtitle:'Key people (names and roles)', date:'Mon YYYY', description:'Nature and significance of the breakthrough.', url:'https://...', url_verified:'no', badges: exampleBadge, caveat:'Journal, award or recognition', status:'active' },
    { section:'evolving',      type:'example',        title:'EXAMPLE \u2014 Name of the unresolved development', subtitle:'', date:'Mon YYYY \u2013 ongoing', description:'What is still unfolding and why it is not yet settled.', url:'https://...', url_verified:'no', badges:'unresolved', caveat:'What would need to happen for this to move out of Evolving.', status:'active' }
  ];
  if (hasRegulation) {
    var regExampleType = regTypes[0] || 'export';
    examples.splice(4, 0, { section:'regulation', type:regExampleType, title:'EXAMPLE \u2014 Enter regulation/law/control regime name', subtitle:'', date:'', description:'What this regulates and who it applies to.', url:'https://...', url_verified:'no', badges:regExampleType, caveat:'', status:'active' });
  }

  function objToRow(obj) {
    return CSV_COLS.map(function(c){ return esc(obj[c] || ''); }).join(',');
  }

  var lines = [CSV_COLS.join(','), objToRow(guide)].concat(examples.map(objToRow));
  dl('uk-' + activeSector + '-template.csv', lines.join('\r\n'));
  showToast('Template downloaded. Delete the GUIDE and EXAMPLE rows before importing.', 'ok');
}

/* ──────────────── CSV IMPORT ──────────────── */

document.getElementById('csv-input').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  if (!activeSector) return;

  if (typeof Papa === 'undefined') {
    showToast('Papa Parse library did not load \u2014 check your internet connection.', 'err');
    return;
  }

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      var rows = results.data;
      if (!rows.length) { showToast('No data rows found in the CSV.', 'err'); return; }

      var validSecs = SECTIONS.map(function(s){ return s.key; });
      var bySection = {};

      rows.forEach(function(r) {
        var sec = (r.section || '').trim().toLowerCase();
        if (!sec || sec.charAt(0) === '#') return; // skip guide / comment rows
        if (validSecs.indexOf(sec) === -1) return; // skip unknown sections silently
        (bySection[sec] = bySection[sec] || []).push(r);
      });

      var secCount = Object.keys(bySection).length;
      if (!secCount) {
        showToast('No recognisable section data found. Check the "section" column uses values like timeline, institution, initiative, breakthrough.', 'err');
        return;
      }

      var data = SECTOR_DATA[activeSector];
      var totalImported = 0;
      Object.keys(bySection).forEach(function(sec) {
        var csvRows = bySection[sec];

        // Remove existing records for this section, in this sector only
        for (var i = data.length - 1; i >= 0; i--) {
          if (data[i].section === sec) data.splice(i, 1);
        }

        // Add new records
        csvRows.forEach(function(r) {
          data.push({
            section:      sec,
            type:         (r.type || '').trim(),
            title:        (r.title || '').trim(),
            subtitle:     (r.subtitle || '').trim(),
            date:         (r.date || '').trim(),
            description:  (r.description || '').trim(),
            url:          (r.url || '').trim(),
            url_verified: (r.url_verified || 'no').trim(),
            badges:       (r.badges || '').split(';').map(function(b){ return b.trim(); }).filter(Boolean),
            caveat:       (r.caveat || '').trim(),
            status:       (r.status || 'active').trim()
          });
          totalImported++;
        });
      });

      renderAll();
      showToast('Imported ' + totalImported + ' records across ' + secCount + ' section(s). Previous data for those sections replaced.', 'ok');
    },
    error: function(err) {
      showToast('CSV parse error: ' + err.message, 'err');
    }
  });
});

/* ──────────────── TOAST ──────────────── */

var toastTimer;
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type === 'err' ? 't-err' : 't-ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = 'toast'; }, 6000);
}

/* ──────────────── INIT ──────────────── */

renderView();

</script>
</body>
</html>
